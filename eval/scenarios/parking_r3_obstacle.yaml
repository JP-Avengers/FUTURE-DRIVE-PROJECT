# 실제 주차장 r3 — 장애물 회피 시나리오 v0 (10.14, D). 형식은 Proxy 계획 9장 초안(eval/scenarios/*.yaml)을 따름.
# 기준선(화단 3 m 선)에서 가장 긴 직선(남쪽 변, 시계 방향 s ≈ 15.5 ~ 40.5 m)의 가운데에 상자 하나 — 피하고 돌아올 공간이 가장 넓은 곳.
# 장애물 위치는 기준선의 길이 s · 옆 오프셋(왼쪽 +)으로 적고, sim/make_obstacles.py 가 월드 좌표 · 바닥 높이를 붙여 USD 레이어로 만든다.
name: parking_r3_obstacle
version: v0
scene: sim/scenes/parking/parking_v0.4b_r3.usda
route: eval/routes/parking_r3_cw.csv      # s 를 재는 기준(시계 방향). 반시계로 돌아도 장애물 자리는 같음
directions: [cw, ccw]
start: {x: -1.756, y: -7.621, yaw_deg: -96.0}   # 씬 시작 자세 = 기준선 출발점
goal: {lap: 1, radius_m: 1.0}                   # 한 바퀴 돌아 출발점 1.0 m 안(수행계획서 2.4)
obstacles:
  - {name: box_south, type: box, s: 28.0, lateral: 0.0, size: [0.6, 0.6, 0.8], yaw_deg: 0.0, color: [0.55, 0.38, 0.22]}
deviation_limit_m: 2.0    # 수행계획서 2.4 — 넘으면 개입(자동 종료 · 리셋)
stall_limit_s: 10         # 수행계획서 2.4
timeout_s: 300            # 임시값(한 바퀴 약 130 s)
