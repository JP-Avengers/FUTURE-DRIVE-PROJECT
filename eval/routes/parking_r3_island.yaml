# 실제 주차장(맵 v0.4b r3) 기준선 정의 — 가운데 화단 윤곽을 d m 바깥으로 둥글게 부풀린 닫힌 선. 평가 · 자동 교사 · 경로 입력이 같은 선을 쓴다.
# 상태: 임시(10.13 멘토 회의 전, D 가 d 3.0 m 로 잡아 둠). 꼭짓점은 D 가 위에서 본 정사 영상에서 눈으로 찍은 초안(±1 m) — B · C 확인 전.
# 촬영 궤적(route_bonnet_cw.csv)을 쓰지 않는 이유: 외곽을 담으려 일부러 크게 · 작게 돈 경로라 4회차가 같은 지점에서 최대 10 m 다름.
# 고친 뒤 다시 만들기: python3 eval/routes/make_refline.py eval/routes/parking_r3_island.yaml  → parking_r3_cw/ccw .csv · .yaml
name: parking_r3
version: v0-draft
scene: sim/scenes/parking/parking_v0.4b_r3.usda
frame: B 맵 좌표 (원점 = 10.5 촬영 첫 키프레임, 방위 임의 — ENU 아님. C 추정 씬 → ENU 회전 −166°)
d: 3.0          # 화단 경계에서 기준선까지(m). ±2.35 m 띠(이탈 기준 2.0 + 로봇 반폭 0.35)가 화단에 닿지 않게
step: 0.25
start_after: NE # NE 모서리 원호가 끝나는 곳(동쪽 변 시작)에서 출발 — 실제 방위로는 남서 꼭짓점 쪽(수행계획서 출발점), 시계 방향
island:         # 시계 방향 [이름, x, y]
  - [NW, -26.30, -2.38]   # 북쪽 변(남쪽 경계석과 평행) 서쪽 끝 — 나무 그늘 끝. 북쪽 경계석은 낮아 메쉬에서 장애물로 안 잡힘
  - [NE, -4.74, -7.31]    # 동쪽 끝 시설물 모서리
  - [SE, -5.81, -17.56]   # 동쪽 변과 남쪽 경계석(흰 선)이 만나는 곳
  - [SW, -30.80, -11.83]  # 남쪽 경계석(흰 선, 기울기 −12.9°) 서쪽 끝
  - [W, -33.00, -8.60]    # 서쪽 끝(비스듬히 깎인 모양)
