# 설치: pip install pre-commit && pre-commit install   (server207: $CD1/envs/tools_env 에 설치됨)
# 수동 전체 검사: pre-commit run --all-files
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      # 5MB 넘는 파일 커밋 차단 — .gitignore 가 놓친 새 형식 대비 (GitHub: 50MB 경고, 100MB 거부)
      - id: check-added-large-files
        args: ["--maxkb=5120"]
      # SSH·TLS 개인키 커밋 차단 (public 레포)
      - id: detect-private-key
      # 머지 충돌 표식이 남은 채 커밋되는 것 차단
      - id: check-merge-conflict
  - repo: local
    hooks:
      # sim/ 은 Isaac Sim(numpy 2.x) 안에서 도는 코드 — apt cv_bridge(numpy 1.x 빌드)는 색 변환 시 세그폴트 (sim/README.md)
      - id: no-cv-bridge-in-sim
        name: "sim/ 에서 cv_bridge import 금지 (Isaac Sim 세그폴트) — ros2_ws/src 노드로 옮기세요"
        language: pygrep
        entry: '^\s*(from|import)\s+cv_bridge\b|import_module\(\s*[\x27"]cv_bridge|__import__\(\s*[\x27"]cv_bridge'
        files: ^sim/.*\.py$
