# 주차장 v0.9 후보 (11.11) — v0.8 r3 + B 맵 v0.5g 의 가운데 섬 바닥 (11/8 손 촬영, 정식 부분만).
#   - 입력 폴더만 v0.5 → v0.5g: 형상 메쉬에 섬 바닥 74 m2, 바닥 높이 지도 61 m2 가 외삽 → 측정 (conf 4). 주행 통로 · 차량 키프레임 · 좌표는 v0.5 와 같음
#   - 손 촬영 키프레임 hand_fecen 을 맨 뒤 묶음으로: 차량 키프레임이 못 칠한 곳(섬)에만 씀
#   - 둘레 실험층 hand_perimeter_nr3_EXPERIMENTAL.ply 는 쓰지 않음 (0.2~3 m 어긋남, B 가 정식 형상과 합치지 않음)
base: parking_v08r3.yaml

out: ~/jinwoo/out/pipeline/map_v09

input:
  root: ~/jinwoo/data/FutureDrive_map_v0.5g/map_v0.5g

colorize:
  extra_inputs:                        # parking.yaml 과 같은 순서 · 제외 구역 (폴더만 v0.5g) + 손 촬영을 맨 뒤에
    - name: bonnet_ccw
      input: {format: rtabmap_keyframes, root: ~/jinwoo/data/FutureDrive_map_v0.5g/map_v0.5g, keyframes: keyframes_bonnet_ccw, poses: trajectory_bonnet_ccw_camera_optical.txt, depth_scale: 1000.0}
      exclude_xy:
        - [0, 5, -13, 10]
    - name: roof_cw
      input: {format: rtabmap_keyframes, root: ~/jinwoo/data/FutureDrive_map_v0.5g/map_v0.5g, keyframes: keyframes_roof_cw, poses: trajectory_roof_cw_camera_optical.txt, depth_scale: 1000.0}
    - name: roof_ccw
      input: {format: rtabmap_keyframes, root: ~/jinwoo/data/FutureDrive_map_v0.5g/map_v0.5g, keyframes: keyframes_roof_ccw, poses: trajectory_roof_ccw_camera_optical.txt, depth_scale: 1000.0}
      exclude_xy:
        - [-34, -17, 3, 14]
        - [0, 5, -13, 10]
    - name: hand_fecen                 # 11/8 손 촬영 (D435i) 섬 왕복 104장 — 섬 테두리 기준 0.1~0.3 m, 차량 촬영과 날짜 · 밝기 다름
      input: {format: rtabmap_keyframes, root: ~/jinwoo/data/FutureDrive_map_v0.5g/map_v0.5g, keyframes: keyframes_hand_fecen, poses: trajectory_hand_fecen_camera_optical.txt, depth_scale: 1000.0}

floor_texture:
  photometric_groups:
    - [main, bonnet_ccw]
    - [roof_cw, roof_ccw]
    - [hand_fecen]                     # 다른 날 · 손에 든 카메라 → 밝기 모형 따로
