# 주차장 v0.9 후보 (11.11) — v0.8 r3 + B 맵 v0.5g 의 가운데 섬 바닥 (11/8 손 촬영, 정식 부분만).
#   - 입력 폴더만 v0.5 → v0.5g: 형상 메쉬에 섬 바닥 74 m2, 바닥 높이 지도 61 m2 가 외삽 → 측정 (conf 4). 주행 통로 · 차량 키프레임 · 좌표는 v0.5 와 같음
#   - 손 촬영 키프레임 hand_fecen 을 맨 뒤 묶음으로: 차량 키프레임이 못 칠한 곳(섬)에만 씀
#   - 둘레 실험층 hand_perimeter_nr3_EXPERIMENTAL.ply 는 쓰지 않음 (0.2~3 m 어긋남, B 가 정식 형상과 합치지 않음)
base: parking_v08r3.yaml

out: ~/jinwoo/out/pipeline/map_v09

input:
  root: ~/jinwoo/data/FutureDrive_map_v0.5g/map_v0.5g

colorize:
  extra_inputs:                        # parking.yaml 과 같은 순서 · 제외 구역 (폴더만 v0.5g) + 손 촬영을 맨 뒤에
    - name: bonnet_ccw
      input: {format: rtabmap_keyframes, root: ~/jinwoo/data/FutureDrive_map_v0.5g/map_v0.5g, keyframes: keyframes_bonnet_ccw, poses: trajectory_bonnet_ccw_camera_optical.txt, depth_scale: 1000.0}
      exclude_xy:
        - [0, 5, -13, 10]
    - name: roof_cw
      input: {format: rtabmap_keyframes, root: ~/jinwoo/data/FutureDrive_map_v0.5g/map_v0.5g, keyframes: keyframes_roof_cw, poses: trajectory_roof_cw_camera_optical.txt, depth_scale: 1000.0}
    - name: roof_ccw
      input: {format: rtabmap_keyframes, root: ~/jinwoo/data/FutureDrive_map_v0.5g/map_v0.5g, keyframes: keyframes_roof_ccw, poses: trajectory_roof_ccw_camera_optical.txt, depth_scale: 1000.0}
      exclude_xy:
        - [-34, -17, 3, 14]
        - [0, 5, -13, 10]
    - name: hand_fecen                 # 11/8 손 촬영 (D435i) 섬 왕복 104장 — 섬 테두리 기준 0.1~0.3 m, 차량 촬영과 날짜 · 밝기 다름
      input: {format: rtabmap_keyframes, root: ~/jinwoo/data/FutureDrive_map_v0.5g/map_v0.5g, keyframes: keyframes_hand_fecen, poses: trajectory_hand_fecen_camera_optical.txt, depth_scale: 1000.0}

floor_texture:
  photometric_groups:
    - [main, bonnet_ccw]
    - [roof_cw, roof_ccw]
    - [hand_fecen]                     # 다른 날 · 손에 든 카메라 → 밝기 모형 따로
  set_max_dist_m: {hand_fecen: 4.0}    # 손 촬영은 4 m 안에서 본 바닥만 (자세 오차 0.1~0.3 m — 멀수록 주차선이 번지고 겹쳐 보임, 11.11 첫 빌드)
  flatten:                             # 가운데 섬 · 외곽이 얼룩덜룩함 (11.12): 다른 날 · 다른 카메라 묶음이 칠한 구역이 색 통일에서 빠져 있었음
    match_sets: [bonnet_ccw, hand_fecen]   # 묶음마다 아스팔트 중앙 색을 주 묶음에 맞춤 (채널별 배율). 지붕 묶음은 뺌 — 배율이 커서 그늘의 푸른 기가 밝게 튐
    detint_shadow: 0.03                    # 그늘진 바닥의 푸른 기 빼기 (B − R 이 이보다 크고 어두운 무채색 계열 텍셀)
    weak_sets: [roof_cw, roof_ccw, hand_fecen]                # 이 묶음이 칠한 곳은 색이 조금 낀 칸(sat_max_weak)도 아스팔트로 보고 색 통일
    sat_max_weak: 0.14
    force_island: true                 # 가운데 섬(B conf 구멍)은 B 구역이 '풀 · 기타'여도 아스팔트로 색 통일
    smooth_sets: [roof_cw, roof_ccw]   # 지붕 카메라가 칠한 흐릿한 텍셀의 자잘한 얼룩을 넓게 흐림
    smooth_m: 0.25
  stalls:                              # 주차칸 다듬기 (pipeline/stalls.py) — 구불거리는 주차선을 지우고 줄마다 같은 간격의 반듯한 선으로 다시 그림. 보완(만든 것)
    stall_w_m: 2.5                     # B 실측 (site_measurements.md): 폭 250 cm · 길이 500 cm(선 중심) · 선 15 cm
    stall_l_m: 5.0
    line_w_m: 0.15
  fill_stalls:
    holes:                             # 섬 바닥이 손 촬영으로 채워져 구멍으로 안 잡힘 → B 바닥 지도 conf 로 섬을 잡음 (차량이 못 본 안쪽 = conf 0 · 4)
      conf_map: floor_height.npz       # 찍힌 바닥(주차선)은 남기고, 안 찍힌 곳 · 어두운 얼룩 · 색 낀 밝은 얼룩만 아스팔트로
      measured_conf: [1, 2, 3]

edge:
  island:
    conf_map: floor_height.npz         # 위와 같은 섬 범위에서 스캔 조각을 지움 (r3 와 같게 — 섬 메우기가 꺼져 조각이 남았음, 11.11 첫 빌드)
    measured_conf: [1, 2, 3]
    margin_m: 1.0                      # conf 구멍은 이미 차량이 못 본 범위 전체라 3 m 까지 넓히지 않음
  show_curb: false                     # 만든 연석 · 인도 띠는 보이지 않게 (사용자 결정 11.11 — 도로가 끝나는 테두리가 인위적). 충돌 메쉬에는 그대로 (경계 · Nav2 지도는 r3 와 같음)
  show_sidewalk: false
  perimeter:                           # 둘레 스캔 (B v0.5g 손 촬영 실험층, 지역마다 0.2~3 m 어긋남) — 연석 밖의 바닥 수준 면만 보이는 메쉬로 (Perimeter prim, 충돌 없음)
    mesh: hand_perimeter_nr3_EXPERIMENTAL.ply
    max_h_m: 0.22                      # 바닥 지도 높이 + 이 아래만 (도로 · 주차장 · 보도 바닥). 라이다 높이 띠(약 0.23 m~) 아래 — 지도에 없는 형상이 라이다에 안 잡히게
    below_m: 0.3
    min_nz: 0.75                       # 위를 향한 면만 (턱 옆면 · 벽 · 깨진 조각 뺌)
    open_m: 0.3                        # 가장자리 들쭉날쭉한 띠를 이만큼 깎음
    min_area_m2: 2.0                   # 이보다 작은 떨어진 조각은 버림

cars:
  models:
    drop_xy:                           # 한 줄로 빽빽한 두 줄은 차를 놓지 않음 (사용자 결정 11.11 — 상자 차가 벽처럼 보임). 스캔 차는 그대로 지워져 빈 주차칸이 됨
      - [-33.0, -6.0, 12.0, 21.0]      # 북쪽 줄 10대
      - [0.5, 12.0, -14.5, 13.0]       # 동쪽 줄 10대
    mesh_dir: "~/jinwoo/data/cc0/quaternius_cars/pack/Realistic Car Pack - Nov 2018/OBJ"   # 차 모양 = CC0 저폴리곤 차 (Quaternius LowPoly Cars, CC0 1.0 — 레포에는 안 넣음, recon/README). 없으면 상자 차
    mesh_models: {NormalCar1: 3, NormalCar2: 2, SUV: 3, SportsCar: 1, SportsCar2: 1}     # 쓸 모델: 고르는 비중 (택시 · 경찰차는 뺌)
    manual_file: parking_v09_cars.json # 손으로 놓은 차 (recon/tools/car_editor.py 화면에서 저장한 파일, recon/configs 기준). 있으면 그대로 놓음 — 없으면 아래 자동 자리
    arrange: true                      # 차를 가지런히 (cars.arrange): 주차칸에 든 차는 칸 가운데 · 칸 방향, 나머지는 이웃끼리 같은 방향 · 간격, 긴 주차선 옆 차는 선에 직각
