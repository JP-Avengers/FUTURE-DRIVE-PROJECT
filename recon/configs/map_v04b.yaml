# B 맵 v0.4b (2026-10-11) = 본네트 시계 4회차 맵을 기준으로 새로 만든 판 (바닥이 v0.3 과 구역별 ±15~20 cm 다름). 좌표계 원점·축은 v0.3 과 같음.
# 색 우선순위 (B README): 본네트 시계 → 본네트 반시계 → 지붕 시계 → 지붕 반시계. 줄A 는 시계만.
#   python recon/pipeline/build_usd.py        --config recon/configs/map_v04b.yaml --out $OUT
#   python recon/pipeline/check_visibility.py --config recon/configs/map_v04b.yaml --out $OUT

name: parking
out: ~/recon_out/map_v04b               # 레포 밖. 메쉬·USD 는 커밋하지 않음

input:
  format: rtabmap_keyframes            # B 키프레임 내보내기 (keyframes/rgb·depth·calib + 궤적)
  root: ~/jinwoo/data/FutureDrive_map_v0.4b/map_v0.4b  # 받은 폴더. 경로에 한글이 있으면 Open3D 가 못 읽으므로 영문 경로로 복사
  keyframes: keyframes_bonnet_cw
  poses: trajectory_bonnet_cw_camera_optical.txt  # 시각 tx ty tz qx qy qz qw id — 카메라 광학 좌표계 → map
  depth_scale: 1000.0                  # keyframes/depth 는 mm (B 가 보정 완료 — 다시 보정하지 않음)

geometry:                              # 받은 형상 메쉬 (input.root 기준)
  mesh: geometry_rawdepth_tsdf_5cm.ply # 형상 기준 (색 없음)

cleanup:
  min_cluster_tris: 500

orient:
  up_hint: [0, 0, 1]                   # 맵이 이미 중력 기준 Z-up (IMU)
  max_tilt_deg: 20
  level: false                         # 중력 방향 그대로 — 바닥 평면에 맞춰 돌리지 않음 (실제 경사 유지)
  origin: keep                         # x·y 는 B 맵 좌표 그대로 (궤적·floor_holes.csv 와 바로 비교). z 만 주 바닥 = 0
  crop_below_floor: 0.3                # 바닥 높이 지도보다 이만큼(m) 아래는 잡음으로 잘라냄

transients:                            # 지나간 사람·차 잔상 지우기: 키프레임 광선이 면을 '뚫고' 더 멀리 찍힌 면
  ray_width: 160                       # 키프레임마다 광선 해상도 (가로)
  max_depth_m: 8.0                     # 이보다 먼 depth 는 안 씀
  tol_m: 0.15                          # 면보다 이만큼 + 거리×per_m 더 멀리 찍혀야 '뚫고 보임'
  tol_per_m: 0.05
  min_through: 3                       # 뚫고 보인 키프레임이 이 이상이고
  through_ratio: 2.0                   # 그 면이 찍힌 횟수의 이 배보다 많으면 지움

ground:                                # 실외 바닥 높이 지도 (없으면 z=0 평면 — 실내). 바닥 채우기·바깥 바닥·벽이 따라감
  cell_m: 0.5
  band_m: 0.3                          # 카메라 경로로 이은 지면에서 이 안의 위 향한 면 = 바닥 (연석 18 cm 포함, 차 보닛 제외)
  camera_height_m: auto                # auto = 카메라에서 아래로 쏜 광선 중앙값 (실측 1.55 m)

fill:
  small_hole_size_m: 0.3
  floor_patch: true
  floor_cell_m: 0.1                    # 주차장은 넓어서 10 cm 칸
  floor_band_m: 0.3                    # 바닥 높이 ± 이 안의 위 향한 면이 있으면 덮인 칸 (연석·보도 포함, 차 밑은 채움)
  max_path_dist_m: 6.0                 # 주행 경로에서 6 m 안만 메움 (B 지도 범위). 루프 가운데 등 촬영 안 된 곳은 억지로 안 채움

single_floor:                          # 바닥 한 장 (D 10.12: 바닥이 겹쳐 PhysX 멈춤·로봇 카메라에 깨져 보임)
  cell_m: 0.1                          # 바닥 높이 지도 칸 (칸마다 바닥 정점 높이 중앙값 → 3×3 중앙값으로 다듬음)
  smooth: 3
  road_smooth_m: 1.5                   # 주행 경로 1.5 m 안 노면은 0.9 m 중앙값 + 가우시안으로 넓게 다듬음 (겹친 바닥 → 계단 방지)
  mesh_cell_m: 0.05                    # 보이는 바닥 격자 (색 해상도)
  band_m: 0.06                         # 바닥 높이 + 이 안의 스캔 면 = 바닥 층 → 뺌 (이보다 솟은 것만 물체로 남김)
  debris_h_m: 0.12                     # 바닥에 뜬 얇은 조각: 가장 높은 곳이 이 안이고
  debris_extent_m: 0.08                # 두께가 이 안이면 지움
  corridor_m: 0.4                      # 차가 실제 지나간 경로에서 이 안에 절반 넘게 걸친
  corridor_h_m: 0.4                    # 이보다 낮은 조각 = 잡음 (차가 지나간 자리라 물체가 있을 수 없음)
  collision_cell_m: 0.25               # 충돌 바닥 격자
  collision_margin_m: 1.0              # 충돌 바닥은 스캔 범위보다 이만큼 넓게 (안 보임)

colorize:                              # 키프레임 RGB → 정점 색. 가림 = 메쉬 깊이 + 키프레임 depth
  max_dist_m: 15.0                     # 이보다 먼 키프레임 색은 안 씀
  top_k: 3                             # 점마다 점수(정면·가까움) 높은 키프레임 몇 장을 섞나
  min_cos: 0.1                         # 면을 거의 옆에서 본 키프레임은 안 씀
  occlusion_tol_m: 0.05                # 메쉬 깊이보다 이만큼 + 거리×per_m 뒤면 가려짐
  occlusion_tol_per_m: 0.02
  depth_tol_m: 0.15                    # 키프레임 depth 와 이만큼 + 거리×per_m 넘게 다르면 버림
  depth_tol_per_m: 0.05
  extra_inputs:                        # 보조 키프레임 묶음 — 이 순서대로, 앞 묶음이 못 칠한 점에만 (B 권장 우선순위)
    - name: bonnet_ccw
      input: {format: rtabmap_keyframes, root: ~/jinwoo/data/FutureDrive_map_v0.4b/map_v0.4b, keyframes: keyframes_bonnet_ccw, poses: trajectory_bonnet_ccw_camera_optical.txt, depth_scale: 1000.0}
      exclude_xy:
        - [0, 5, -13, 10]                # 줄A 세로 주차 줄 — 반시계 맵은 칸 간격이 6~8% 짧음 (B v0.4 README)
    - name: roof_cw
      input: {format: rtabmap_keyframes, root: ~/jinwoo/data/FutureDrive_map_v0.4b/map_v0.4b, keyframes: keyframes_roof_cw, poses: trajectory_roof_cw_camera_optical.txt, depth_scale: 1000.0}
    - name: roof_ccw
      input: {format: rtabmap_keyframes, root: ~/jinwoo/data/FutureDrive_map_v0.4b/map_v0.4b, keyframes: keyframes_roof_ccw, poses: trajectory_roof_ccw_camera_optical.txt, depth_scale: 1000.0}
      exclude_xy:
        - [-34, -17, 3, 14]              # 북쪽 주차칸 — v0.3 반시계 맵이 번져 주차선 약 60 cm 어긋남
        - [0, 5, -13, 10]                # 줄A 세로 주차 줄 — 반시계 맵은 칸 간격이 6~8% 짧음 (B v0.4 README)
  floor_lift_m: auto                   # 묶음마다 '키프레임 depth 바닥 − 메쉬 바닥'을 재서 그만큼 올려 투영 (v0.3: 4.5 cm 고정)

decimate:
  visual_tris: 0                       # 0 = 줄이지 않음. 정점 색이라 줄이면 바닥부터 줄어 주차선이 뭉개짐 (텍스처 방식은 다음 단계)
  collider_tris: 200000

zones:                                 # 10.7 미팅: 배경은 보이는 대로 (벽 X), 외곽은 인위적으로 마무리하지 않고 점군 보강으로
  near_cell_m: 0.1
  far_tris: 200000
  ground_cell_m: 0.5
  ground_margin_m: 1.0                 # 충돌용 바닥 면만 지도보다 1 m 넓게 (안 보임)
  ground_far: false                    # 지도 밖 보이는 바닥 면 안 만듦
  ground_plane: false                  # 충돌 바닥 판 따로 안 깜 (single_floor 가 이미 깔아서 — 겹치면 PhysX 멈춤)
  backdrop_height_m: 0                 # 배경 벽 안 만듦
  boundary_height_m: 2.0               # 안 보이는 경계벽 (충돌만 — 차가 지도 밖으로 못 나감)

visibility:                            # 차량 카메라 경로 (지붕 1.55 m) 기준
  path_step: 5
  offsets_m: [-1.0, 0.0, 1.0]
  yaws_deg: [-30, 0, 30]
  min_clearance_m: 0.2
  ray_width: 160
  horizon_deg: 11.5
  list_cell_m: 0.5
  list_top: 30

usd:
  double_sided: [Visual]               # 시각용 메쉬는 양면 — 로봇 카메라(0.35 m)에서 물체 뒷면이 비쳐 보이지 않게
