# 주차장 (맵 v0.8 r2와 같은 결과) = 실외 틀 + 이 장소에만 해당하는 것. map_v08.yaml 과 합친 결과가 같은지 recon/pipeline/config.py 로 확인함 (11.07).
#   python recon/pipeline/run.py --config recon/configs/parking.yaml
base: templates/outdoor_rtabmap.yaml

name: parking
out: ~/recon_out/map_v08

input:
  format: rtabmap_keyframes            # B 키프레임 내보내기 (keyframes/rgb·depth·calib + 궤적)
  root: ~/jinwoo/data/FutureDrive_map_v0.5  # 받은 폴더. 경로에 한글이 있으면 Open3D 가 못 읽으므로 영문 경로로 복사
  keyframes: keyframes_bonnet_cw
  poses: trajectory_bonnet_cw_camera_optical.txt  # 시각 tx ty tz qx qy qz qw id — 카메라 광학 좌표계 → map
  depth_scale: 1000.0                  # keyframes/depth 는 mm (B 가 보정 완료 — 다시 보정하지 않음)

colorize:
  extra_inputs:                        # 보조 키프레임 묶음 — 이 순서대로, 앞 묶음이 못 칠한 점에만 (B 권장 우선순위)
    - name: bonnet_ccw
      input: {format: rtabmap_keyframes, root: ~/jinwoo/data/FutureDrive_map_v0.5, keyframes: keyframes_bonnet_ccw, poses: trajectory_bonnet_ccw_camera_optical.txt, depth_scale: 1000.0}
      exclude_xy:
        - [0, 5, -13, 10]                # 줄A 세로 주차 줄 — 반시계 맵은 칸 간격이 6~8% 짧음 (B v0.4 README)
    - name: roof_cw
      input: {format: rtabmap_keyframes, root: ~/jinwoo/data/FutureDrive_map_v0.5, keyframes: keyframes_roof_cw, poses: trajectory_roof_cw_camera_optical.txt, depth_scale: 1000.0}
    - name: roof_ccw
      input: {format: rtabmap_keyframes, root: ~/jinwoo/data/FutureDrive_map_v0.5, keyframes: keyframes_roof_ccw, poses: trajectory_roof_ccw_camera_optical.txt, depth_scale: 1000.0}
      exclude_xy:
        - [-34, -17, 3, 14]              # 북쪽 주차칸 — v0.3 반시계 맵이 번져 주차선 약 60 cm 어긋남
        - [0, 5, -13, 10]                # 줄A 세로 주차 줄 — 반시계 맵은 칸 간격이 6~8% 짧음 (B v0.4 README)

sky:                                   # 하늘 돔 텍스처 (pipeline/sky.py) → usd/sky.usda 를 씬 루트에서 world.usda 보다 위에
  sets: [roof_cw, roof_ccw]            # 지붕 카메라 (위로 약 26° 까지 봄)
  sky_smooth_std: 0.02                 # 하늘 화소: 7×7 밝기 표준편차가 이보다 작고 (v0.6 까지 far_tsdf 에 있던 값)
  sky_smooth_bright: 0.55              # 이보다 밝거나
  sky_white_bright: 0.85               # 이보다 아주 밝음
  dome_intensity: 600                  # D 씬 루트의 돔 세기 (텍스처 없음) — 같은 밝기가 되게 나눔

cars:                                  # 스캔 주차 차 지우기 (pipeline/cars.py)
  remove: true
  objects: outer/objects.csv           # input.root 기준 — B 주차 차 33대
  margin_m: 0.3                        # 차 사각형을 이만큼 넓혀 지움
  near_m: 1.0                          # 지운 둘레 이 안에 걸린
  leftover_tris: 3000                  # 이보다 작은 조각은 같이 지움 (차 부스러기)
  float_h_m: 0.5                       # 가장 낮은 곳이 바닥 위 이보다 높은 조각도 지움 (차가 빠지니 공중에 뜬 건물 조각이 눈에 띔)
  extra: &extra_cars                   # B 목록에 없는 덩어리 [x, y, yaw_deg, 길이, 폭] — 메쉬 · 키프레임 사진으로 확인 (11.06)
    - [-38.46, -1.20, 171, 11.79, 5.16]  # 서쪽 주차 줄
    - [-31.86, 4.57, 165, 6.14, 3.00]
    - [-32.31, 2.35, 39, 1.57, 2.94]
    - [-34.98, 2.16, 39, 0.74, 1.71]
    - [-39.24, -5.45, 69, 0.94, 1.51]
    - [-41.05, -3.95, 45, 0.38, 0.95]
    - [-25.16, -21.72, 42, 5.86, 4.38]   # 남쪽 주차 줄
    - [-18.28, -22.18, 147, 3.63, 2.36]
    - [-18.79, -25.33, 153, 1.49, 2.20]
    - [-20.45, -24.99, 162, 0.95, 0.54]
    - [-39.29, -22.20, 30, 1.63, 0.76]
    - [-9.80, -15.85, 0, 1.90, 1.80]     # 가운데 (주차 구역)
    - [-6.32, -14.70, 150, 1.12, 2.11]
    - [-17.83, -4.36, 63, 1.04, 1.98]
    - [-0.90, 9.75, 0, 0.90, 1.00]       # 동쪽 차로 잔상 (사진에는 빈 도로)
    - [-0.62, 11.83, 141, 0.51, 1.38]

floor_texture:
  fill_stalls:                         # 차가 서 있던 주차칸 → 주행 도로의 깨끗한 아스팔트 조각으로 (흰 주차선은 남김)
    objects: outer/objects.csv         # input.root 기준 — B 주차 차 33대 (위치·방향·길이·폭)
    extra_cars: *extra_cars            # + B 목록에 없는 차 (위 cars.extra)
    zones: outer/ground_zones.npz      # B 바닥 구역 (아스팔트 안만, 풀·붉은 보도 둘레 30 cm 는 안 채움)
    margin_len_m: 0.3                  # 차 사각형을 앞뒤로 · 옆으로 넓힘
    margin_side_m: 0.1
    shadow_m: 1.2                      # 차 둘레 이 안의 회색 계열 어두운 얼룩 = 차 그림자 · 차 밑
    unseen_m: 3.0                      # 차 둘레 이 안의 안 찍힌 곳도 채움 (바닥 가장자리는 그대로)
    patch_m: 1.2                       # 채울 무늬 조각 크기 · 개수 (주행 경로에서 가장 선명하게 찍힌 곳)
    patches: 12
    holes:                             # 바닥 범위 안 큰 구멍(가운데 섬) + 둘레 margin_m 의 안 찍힌 바닥도 아스팔트로 (edge.island mode floor 와 짝)
      min_area_m2: 4.0
      margin_m: 9.0                    # 텍스처만 (바닥 모양은 edge.island) — 5 m 로도 섬 서쪽 검은 쐐기(-31.5, -7)가 남음 (11.06)
