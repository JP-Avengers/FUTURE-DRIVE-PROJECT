# 맵 v0.7 (2026-11-01) = v0.6 r2 (형상 · 바닥 텍스처 그대로) + 테두리 마감 (edge), 먼 구역(far_tsdf) 끔.
# 10/30 팀 결정: 원경은 건물처럼 보이지 않고 잡음이라 빼고, 맵 테두리는 연석 · 인도 · 나무 · 잔디로 깔끔하게 마무리
# (10/7 '배경 벽 · 인위적 마감 없이' 방침을 바꿈. 원경을 켜면 X-Mobility 평균 이탈 0.80 → 1.59 m 로 나빠졌음 — D 10.14).
# 바닥 텍스처는 같은 설정이라 map_v06 결과의 floor_tex/ 를 결과 폴더에 복사해 두면 굽기(20~60분)를 건너뜀 (reuse_bake).
#   python recon/pipeline/build_usd.py --config recon/configs/map_v07.yaml --out $OUT

name: parking
out: ~/recon_out/map_v07                # 레포 밖. 메쉬·USD 는 커밋하지 않음

input:
  format: rtabmap_keyframes            # B 키프레임 내보내기 (keyframes/rgb·depth·calib + 궤적)
  root: ~/jinwoo/data/FutureDrive_map_v0.5  # 받은 폴더. 경로에 한글이 있으면 Open3D 가 못 읽으므로 영문 경로로 복사
  keyframes: keyframes_bonnet_cw
  poses: trajectory_bonnet_cw_camera_optical.txt  # 시각 tx ty tz qx qy qz qw id — 카메라 광학 좌표계 → map
  depth_scale: 1000.0                  # keyframes/depth 는 mm (B 가 보정 완료 — 다시 보정하지 않음)

geometry:                              # 받은 형상 메쉬 (input.root 기준)
  mesh: geometry_clean_5cm.ply         # 형상 기준 (색 없음). v0.5 에서 이름 바뀜 (v0.4b geometry_rawdepth_tsdf_5cm.ply)

cleanup:
  min_cluster_tris: 500

orient:
  up_hint: [0, 0, 1]                   # 맵이 이미 중력 기준 Z-up (IMU)
  max_tilt_deg: 20
  level: false                         # 중력 방향 그대로 — 바닥 평면에 맞춰 돌리지 않음 (실제 경사 유지)
  origin: keep                         # x·y 는 B 맵 좌표 그대로 (궤적·floor_holes.csv 와 바로 비교). z 만 주 바닥 = 0
  crop_below_floor: 0.3                # 바닥 높이 지도보다 이만큼(m) 아래는 잡음으로 잘라냄

transients:                            # 지나간 사람·차 잔상 지우기: 키프레임 광선이 면을 '뚫고' 더 멀리 찍힌 면
  ray_width: 160                       # 키프레임마다 광선 해상도 (가로)
  max_depth_m: 8.0                     # 이보다 먼 depth 는 안 씀
  tol_m: 0.15                          # 면보다 이만큼 + 거리×per_m 더 멀리 찍혀야 '뚫고 보임'
  tol_per_m: 0.05
  min_through: 3                       # 뚫고 보인 키프레임이 이 이상이고
  through_ratio: 2.0                   # 그 면이 찍힌 횟수의 이 배보다 많으면 지움

ground:                                # 실외 바닥 높이 지도 (없으면 z=0 평면 — 실내). 바닥 채우기·바깥 바닥·벽이 따라감
  cell_m: 0.5
  band_m: 0.3                          # 카메라 경로로 이은 지면에서 이 안의 위 향한 면 = 바닥 (연석 18 cm 포함, 차 보닛 제외)
  camera_height_m: auto                # auto = 카메라에서 아래로 쏜 광선 중앙값 (실측 1.55 m)

fill:
  small_hole_size_m: 0.3
  floor_patch: true
  floor_cell_m: 0.1                    # 주차장은 넓어서 10 cm 칸
  floor_band_m: 0.3                    # 바닥 높이 ± 이 안의 위 향한 면이 있으면 덮인 칸 (연석·보도 포함, 차 밑은 채움)
  max_path_dist_m: 6.0                 # 주행 경로에서 6 m 안만 메움 (B 지도 범위). 루프 가운데 등 촬영 안 된 곳은 억지로 안 채움

single_floor:                          # 바닥 한 장 (D 10.12: 바닥이 겹쳐 PhysX 멈춤·로봇 카메라에 깨져 보임)
  ground_map: floor_height.npz         # B v0.5 바닥 높이 지도 (본네트 9회차 depth 5 m 안, 10 cm) 를 그대로 — 아래 cell_m · smooth · road_smooth_m 은 안 씀.
                                       # 메쉬에서 다시 뽑으면 v0.5 바닥이 10 cm 격자 한 장이라 칸마다 정점 1개 → 바닥 칸이 빠지고 연석 윗면 등이 남아 10~15 cm 뜸 (10.14 확인)
  cell_m: 0.1                          # 바닥 높이 지도 칸 (칸마다 바닥 정점 높이 중앙값 → 3×3 중앙값으로 다듬음)
  smooth: 3
  road_smooth_m: 1.5                   # 주행 경로 1.5 m 안 노면은 0.9 m 중앙값 + 가우시안으로 넓게 다듬음 (겹친 바닥 → 계단 방지)
  mesh_cell_m: 0.05                    # 보이는 바닥 격자 (색 해상도)
  band_m: 0.06                         # 바닥 높이 + 이 안의 스캔 면 = 바닥 층 → 뺌 (이보다 솟은 것만 물체로 남김)
  debris_h_m: 0.12                     # 바닥에 뜬 얇은 조각: 가장 높은 곳이 이 안이고
  debris_extent_m: 0.08                # 두께가 이 안이면 지움
  flat_h_m: 0.10                       # 두께와 상관없이 가장 높은 곳이 이 안인 조각도 지움 (바닥 판과 겹친 납작한 조각 — D 10.13 PhysX 멈춤)
  corridor_m: 0.4                      # 차가 실제 지나간 경로에서 이 안에 절반 넘게 걸친
  corridor_h_m: 0.4                    # 이보다 낮은 조각 = 잡음 (차가 지나간 자리라 물체가 있을 수 없음)
  collision_cell_m: 0.1                # 충돌 바닥 격자 = B 바닥 지도 칸 (25 cm 면 연석 단차가 경사로가 되어 가장자리 오차 최대 33 cm — 10.14)
  collision_floor_min_tris: 200        # 이보다 작은 충돌 바닥 섬은 지움 (범위 가장자리 1~9삼각형 섬 8개가 D 도구에 '납작한 조각'으로 잡힘)
  collision_object_tris: 120000        # 충돌 물체 줄이는 목표 (바닥 격자가 촘촘해져 decimate.collider_tris 에서 빼는 대신 따로)
  collision_margin_m: 1.0              # 충돌 바닥은 스캔 범위보다 이만큼 넓게 (안 보임)
  collision_low_h_m: 0.15              # 충돌 물체(줄인 뒤): 조각 전체가 바닥 위 이 안이면 지움 (작은 잡음 덩어리 — 걸림 · PhysX 멈춤)
  collision_flat_h_m: 0.10             # 충돌 물체: 바닥 위 이 안의 거의 수평인 면 지움 (물체 밑동의 두 번째 바닥)

colorize:                              # 키프레임 RGB → 정점 색. 가림 = 메쉬 깊이 + 키프레임 depth
  max_dist_m: 15.0                     # 이보다 먼 키프레임 색은 안 씀
  top_k: 3                             # 점마다 점수(정면·가까움) 높은 키프레임 몇 장을 섞나
  min_cos: 0.1                         # 면을 거의 옆에서 본 키프레임은 안 씀
  occlusion_tol_m: 0.05                # 메쉬 깊이보다 이만큼 + 거리×per_m 뒤면 가려짐
  occlusion_tol_per_m: 0.02
  depth_tol_m: 0.15                    # 키프레임 depth 와 이만큼 + 거리×per_m 넘게 다르면 버림
  depth_tol_per_m: 0.05
  extra_inputs:                        # 보조 키프레임 묶음 — 이 순서대로, 앞 묶음이 못 칠한 점에만 (B 권장 우선순위)
    - name: bonnet_ccw
      input: {format: rtabmap_keyframes, root: ~/jinwoo/data/FutureDrive_map_v0.5, keyframes: keyframes_bonnet_ccw, poses: trajectory_bonnet_ccw_camera_optical.txt, depth_scale: 1000.0}
      exclude_xy:
        - [0, 5, -13, 10]                # 줄A 세로 주차 줄 — 반시계 맵은 칸 간격이 6~8% 짧음 (B v0.4 README)
    - name: roof_cw
      input: {format: rtabmap_keyframes, root: ~/jinwoo/data/FutureDrive_map_v0.5, keyframes: keyframes_roof_cw, poses: trajectory_roof_cw_camera_optical.txt, depth_scale: 1000.0}
    - name: roof_ccw
      input: {format: rtabmap_keyframes, root: ~/jinwoo/data/FutureDrive_map_v0.5, keyframes: keyframes_roof_ccw, poses: trajectory_roof_ccw_camera_optical.txt, depth_scale: 1000.0}
      exclude_xy:
        - [-34, -17, 3, 14]              # 북쪽 주차칸 — v0.3 반시계 맵이 번져 주차선 약 60 cm 어긋남
        - [0, 5, -13, 10]                # 줄A 세로 주차 줄 — 반시계 맵은 칸 간격이 6~8% 짧음 (B v0.4 README)
  floor_lift_m: auto                   # 묶음마다 '키프레임 depth 바닥 − 메쉬 바닥'을 재서 그만큼 올려 투영 (v0.3: 4.5 cm 고정)

decimate:
  visual_tris: 0                       # 0 = 줄이지 않음 (floor_texture 는 0 이어야 함 — 바닥 삼각형 순서로 바닥을 나눔)
  collider_tris: 200000

zones:                                 # 10.7 미팅: 배경은 보이는 대로 (벽 X), 외곽은 인위적으로 마무리하지 않고 점군 보강으로
  near_cell_m: 0.1
  far_tris: 300000                     # 먼 구역(far_tsdf) 줄이는 목표 — 아래 subdivide 로 4배가 됨
  outer_includes_far: false            # 경계벽·충돌 바닥 범위는 스캔만 (먼 구역은 보이기만 — 로봇이 스캔 밖으로 못 나가게)
  ground_cell_m: 0.5
  ground_margin_m: 1.0                 # 충돌용 바닥 면만 지도보다 1 m 넓게 (안 보임)
  ground_far: false                    # 지도 밖 보이는 바닥 면 안 만듦
  ground_plane: false                  # 충돌 바닥 판 따로 안 깜 (single_floor 가 이미 깔아서 — 겹치면 PhysX 멈춤)
  backdrop_height_m: 0                 # 배경 벽 안 만듦
  boundary_height_m: 2.0               # 안 보이는 경계벽 (충돌만 — 차가 지도 밖으로 못 나감)

visibility:                            # 차량 카메라 경로 (지붕 1.55 m) 기준
  path_step: 5
  offsets_m: [-1.0, 0.0, 1.0]
  yaws_deg: [-30, 0, 30]
  min_clearance_m: 0.2
  ray_width: 160
  horizon_deg: 11.5
  list_cell_m: 0.5
  list_top: 30

usd:
  double_sided: [Visual, Trees, Curb]  # 시각용 메쉬는 양면 — 로봇 카메라(0.35 m)에서 물체 뒷면이 비쳐 보이지 않게

sky:                                   # 하늘 돔 텍스처 (pipeline/sky.py) → usd/sky.usda 를 씬 루트에서 world.usda 보다 위에
  sets: [roof_cw, roof_ccw]            # 지붕 카메라 (위로 약 26° 까지 봄)
  sky_smooth_std: 0.02                 # 하늘 화소: 7×7 밝기 표준편차가 이보다 작고 (v0.6 까지 far_tsdf 에 있던 값)
  sky_smooth_bright: 0.55              # 이보다 밝거나
  sky_white_bright: 0.85               # 이보다 아주 밝음
  dome_intensity: 600                  # D 씬 루트의 돔 세기 (텍스처 없음) — 같은 밝기가 되게 나눔

floor_texture:                         # 바닥 텍스처 (pipeline/floor_texture.py) — 바닥 한 장 (single_floor) 이 있을 때만
  cell_m: 0.01                         # 텍셀 1 cm → 바닥 전체 6500×5125 (c2d_usd.md 초안 '2K–4K' 보다 큼 — 4K 안으로는 0.016)
  max_dist_m: 8.0                      # 이보다 먼 바닥은 그 키프레임에서 안 씀 (멀면 흐림)
  top_k: 3                             # 텍셀마다 가장 선명하게 본 3장을
  power: 3.0                           # (가장 선명한 gsd / 그 장 gsd)^3 로 섞음 — 크면 한 장만 (자세 오차 3~4 cm → 평균하면 선이 두 줄)
  border_px: 6
  feather_px: 60                       # 사진 가장자리 60 px 안은 덜 씀 (이어 붙인 경계가 칼같이 안 보이게)
  min_cos: 0.05
  photometric_groups:                  # 같은 카메라끼리 밝기 모형 하나 (키프레임 이득 + 비네팅 + 보는 각도)
    - [main, bonnet_ccw]               # 본네트 (10/9 · 10/10)
    - [roof_cw, roof_ccw]              # 지붕 (10/5) — 잔차 7.5% 로 모형이 안 맞아 보정 안 됨 (10.30)
  photometric_max_rms: 0.06            # 모형 잔차(log)가 이보다 크면 그 묶음은 보정 안 함
  gain_range: [0.7, 1.4]
  reuse_bake: true                     # 같은 설정·입력으로 구운 floor_tex/bake_raw.png 가 있으면 굽기(20~30분) 건너뜀
  flatten:                             # 아스팔트 색을 한 가지로 — sigma_m 보다 넓은 밝기·색 흐름은 전체 아스팔트 중앙 색으로, 작은 무늬만 사진에서
    mode: local                        # (회차·방향·날짜마다 밝기가 달라 위에서 보면 계단·물결 얼룩 — 1.2 m 로 약하게 줄이면 거의 그대로 남음, 10.30)
    sigma_m: 0.3                       # 이보다 작은 무늬(알갱이 · 주차선 · 작은 얼룩)는 사진 그대로
    low: 0.35                          # 대상 = 바닥 위 회색 계열 칸 중 밝기가 아스팔트 중앙의 0.35~1.6 배 (페인트 · 깊은 그림자 뺌)
    high: 1.6
    range: [0.6, 1.6]                  # 칸마다 곱하는 값 한계
  unseen_seam_m: 0.15                  # 사진이 안 닿은 곳(바닥 정점 색) 경계 둘레를 넓게 섞음 — 계단처럼 끊겨 보였음 (D 10.30 영상, 섬 가장자리)
  fill_stalls:                         # 차가 서 있던 주차칸 → 주행 도로의 깨끗한 아스팔트 조각으로 (흰 주차선은 남김)
    objects: outer/objects.csv         # input.root 기준 — B 주차 차 33대 (위치·방향·길이·폭)
    zones: outer/ground_zones.npz      # B 바닥 구역 (아스팔트 안만, 풀·붉은 보도 둘레 30 cm 는 안 채움)
    margin_len_m: 0.3                  # 차 사각형을 앞뒤로 · 옆으로 넓힘
    margin_side_m: 0.1
    shadow_m: 1.2                      # 차 둘레 이 안의 회색 계열 어두운 얼룩 = 차 그림자 · 차 밑
    unseen_m: 3.0                      # 차 둘레 이 안의 안 찍힌 곳도 채움 (바닥 가장자리는 그대로)
    patch_m: 1.2                       # 채울 무늬 조각 크기 · 개수 (주행 경로에서 가장 선명하게 찍힌 곳)
    patches: 12
  material:                            # 표면 요철·거칠기만 (색은 사진). ambientCG Asphalt031 2K (CC0) — 레포에는 안 넣음, recon/README 참고
    normal: ~/jinwoo/data/cc0/Asphalt031/Asphalt031_2K-JPG_NormalGL.jpg
    roughness: ~/jinwoo/data/cc0/Asphalt031/Asphalt031_2K-JPG_Roughness.jpg
    tile_m: 2.0                        # 2 m 마다 반복 — 1 m 면 골재가 실제 노면보다 작게 보이고 로봇 카메라 화소 안에서 평균돼 요철이 안 보임 (D 10.30 영상)
    normal_strength: 1.5               # 요철 기울기 배율 (돔 조명만 있는 씬에서도 보이게)
  detail:                              # 잔무늬 되살리기 — 1~4 cm 무늬 밝기 대비가 실제 사진만큼 되게 모자란 만큼만 CC0 색 사진 무늬로
    color: ~/jinwoo/data/cc0/Asphalt031/Asphalt031_2K-JPG_Color.jpg
    tile_m: 2.0
    target_rel_std: 0.022              # 본네트 사진 2 m 앞 노면 실측 2.2% (텍스처는 섞고 통일하며 1.1~1.2% 로 약해짐, 10.30)
  jpeg_quality: 92

edge:                                  # 테두리 마감 (pipeline/edge_finish.py) — 보완(만든 것): 위치는 측정, 모양은 만든 것
  smooth_m: 1.0                        # 바닥 범위를 이만큼 다듬은 선 = 경계 (D 기준선에서 최소 7.9 m)
  cut_tol_m: 0.1                       # 경계 밖 이만큼까지는 남김 (연석 밑으로 들어가 틈이 안 보이게)
  objects: outer/objects.csv           # input.root 기준 — B 주차 차(경계에 걸쳐도 남김) · 나무 20그루(스캔 덩어리 → 모델)
  tree_cut_scale: 1.3                  # B 수관 지름 × 이 배 안의 바닥 위 30 cm 넘는 스캔 조각을 지움 (차 자리 빼고) — 1.0 이면 줄기 · 덤불 잔해가 남음
  tall_cut_m: 2.2                      # 경계 안쪽 tall_band_m 안의 이보다 높은 스캔 조각도 지움 (나무 · 덤불 잔해, 차는 2 m 아래)
  tall_band_m: 4.0
  island:                              # 가운데 섬(바닥 범위 안 구멍 = 화단): 연석 + 화단(잔디 재질), 섬 안 스캔 조각 지움 (차 자리 빼고)
    min_area_m2: 4.0
    margin_m: 3.0                      # 구멍을 이만큼 넓혀 둘레의 사진 안 닿은 계단 바닥까지 덮음 (둘레 3 m 는 99% 안 찍힘 · D 10.30 영상). 기준선까지 6.1 m
    car_gap_m: 0.5                     # 섬 쪽 주차 차 자리 + 이만큼은 화단에서 뺌
    smooth_m: 0.8
  curb_h_m: 0.15                       # 연석 높이 (B 실측 18 cm — 인도 쪽이 조금 낮은 경우가 많아 15)
  curb_top_m: 0.15
  sidewalk_m: 2.0                      # 인도 띠 폭
  outer_m: 40.0                        # 잔디를 경계에서 이만큼까지 (그 너머는 하늘)
  grass_cell_m: 0.5
